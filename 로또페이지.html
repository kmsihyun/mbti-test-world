<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>행운 추첨소 · MBTI TEST 세상</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lotto.css">
  <script src="lotto.js" defer></script>
</head>
<body>
  <header class="nav">
    <a class="brand" href="index.html">MBTI TEST 세상<span>SELF DISCOVERY CLUB</span></a>
    <nav aria-label="주 메뉴"><a href="explore.html">성격 도감</a><a href="survey.html">테스트 시작 ↗</a></nav>
  </header>
  <main class="lotto">
    <header class="lotto-intro">
      <a class="small-link" href="index.html">← 첫 화면</a>
      <h1>행운 추첨소<span aria-hidden="true">✦</span></h1>
      <p>번호 여섯 개를 고르고, 행운이 몇 개나 겹치는지 맞혀 보세요.</p>
    </header>
    <div class="lotto-layout">
      <section class="lotto-picker" aria-labelledby="pick-title">
        <div class="lotto-heading"><h2 id="pick-title">내 번호 고르기</h2><output id="pick-count">0 / 6</output></div>
        <div id="number-grid" class="number-grid" aria-label="1부터 45까지 번호"></div>
        <div class="lotto-tools">
          <button id="quick-pick" type="button">자동 선택</button>
          <button id="clear-ticket" type="button">지우기</button>
        </div>
      </section>
      <section class="lotto-ticket" aria-labelledby="ticket-title">
        <h2 id="ticket-title">내 티켓</h2>
        <ul id="my-numbers" class="lotto-balls" aria-label="내 번호"></ul>
        <div class="lotto-stub">
          <h2>추첨 번호</h2>
          <ul id="drawn-numbers" class="lotto-balls" aria-label="추첨 번호"></ul>
          <p id="draw-message" role="status">번호 여섯 개를 선택하면 추첨할 수 있어요.</p>
          <fieldset id="reveal-mode">
            <legend>공개 방식</legend>
            <label><input type="radio" name="reveal" value="sequence" checked> 하나씩</label>
            <label><input type="radio" name="reveal" value="instant"> 한 번에</label>
          </fieldset>
          <button class="primary" id="draw" type="button" disabled>추첨하기 <span aria-hidden="true">✦</span></button>
        </div>
      </section>
    </div>
    <p class="lotto-note">재미로 즐기는 모의 추첨이며 실제 복권 구매나 지급은 없습니다.</p>
  </main>
  <footer>2023 ORIGINAL · 2026 RESTORED / 개발 김시현</footer>
</body>
</html>
